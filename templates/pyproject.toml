[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
]
ignore = [
    "E501", # ligne trop longue (laisser de la souplesse pour les prompts longs)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
