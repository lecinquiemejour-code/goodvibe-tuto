name: CI/CD GoodVibe

on:
  push:
    branches: [ "**" ]

jobs:
  test:
    name: Tests et contrôle qualité
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Vérifier le style du code (ruff)
        run: ruff check .

      - name: Exécuter les tests unitaires (pytest)
        run: pytest

  deploy:
    name: Déploiement sur le VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Connexion SSH et exécution du déploiement
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash /home/{{NOM_AGENT}}/app/deploy/deployer.sh
